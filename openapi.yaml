components:
  schemas:
    APIArea:
      description: "\u30A8\u30EA\u30A2\u60C5\u5831\u306EAPI\u30E2\u30C7\u30EB"
      properties:
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
      required:
      - id
      - name
      title: APIArea
      type: object
    APICell:
      description: "\u30BB\u30EB\u60C5\u5831\u306EAPI\u30E2\u30C7\u30EB"
      properties:
        geo_hash:
          title: Geo Hash
          type: string
        id:
          title: Id
          type: integer
        location:
          maxItems: 2
          minItems: 2
          prefixItems:
          - type: number
          - type: number
          title: Location
          type: array
      required:
      - id
      - geo_hash
      - location
      title: APICell
      type: object
    APIPost-Input:
      description: "\u6295\u7A3F\u60C5\u5831\u306EAPI\u30E2\u30C7\u30EB\uFF08\u30E6\
        \u30FC\u30B6\u30FC\u6295\u7A3F\u30FBLLM\u8FD4\u4FE1\uFF09"
      properties:
        area:
          anyOf:
          - $ref: '#/components/schemas/APIArea'
          - type: 'null'
        cell:
          anyOf:
          - $ref: '#/components/schemas/APICell'
          - type: 'null'
        content:
          title: Content
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        location:
          maxItems: 2
          minItems: 2
          prefixItems:
          - type: number
          - type: number
          title: Location
          type: array
        replies:
          default: []
          items:
            $ref: '#/components/schemas/APIPost-Input'
          title: Replies
          type: array
        user_uuid:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: User Uuid
        uuid:
          format: uuid
          title: Uuid
          type: string
      required:
      - uuid
      - content
      - location
      - created_at
      title: APIPost
      type: object
    APIPost-Output:
      description: "\u6295\u7A3F\u60C5\u5831\u306EAPI\u30E2\u30C7\u30EB\uFF08\u30E6\
        \u30FC\u30B6\u30FC\u6295\u7A3F\u30FBLLM\u8FD4\u4FE1\uFF09"
      properties:
        area:
          anyOf:
          - $ref: '#/components/schemas/APIArea'
          - type: 'null'
        cell:
          anyOf:
          - $ref: '#/components/schemas/APICell'
          - type: 'null'
        content:
          title: Content
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        location:
          maxItems: 2
          minItems: 2
          prefixItems:
          - type: number
          - type: number
          title: Location
          type: array
        replies:
          default: []
          items:
            $ref: '#/components/schemas/APIPost-Output'
          title: Replies
          type: array
        user_uuid:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: User Uuid
        uuid:
          format: uuid
          title: Uuid
          type: string
      required:
      - uuid
      - content
      - location
      - created_at
      title: APIPost
      type: object
    CreatePostRequest:
      description: "\u6295\u7A3F\u4F5C\u6210\u30A8\u30F3\u30C9\u30DD\u30A4\u30F3\u30C8\
        \u306E\u30EA\u30AF\u30A8\u30B9\u30C8"
      properties:
        content:
          title: Content
          type: string
        lat:
          title: Lat
          type: number
        lon:
          title: Lon
          type: number
      required:
      - content
      - lat
      - lon
      title: CreatePostRequest
      type: object
    CreatePostResponse:
      description: "\u6295\u7A3F\u4F5C\u6210\u30A8\u30F3\u30C9\u30DD\u30A4\u30F3\u30C8\
        \u306E\u30EC\u30B9\u30DD\u30F3\u30B9"
      properties:
        post:
          $ref: '#/components/schemas/APIPost-Output'
        similar_posts:
          items:
            $ref: '#/components/schemas/APIPost-Output'
          title: Similar Posts
          type: array
      required:
      - post
      - similar_posts
      title: CreatePostResponse
      type: object
    CurrentResponse:
      description: "\u73FE\u5728\u4F4D\u7F6E\u30A8\u30F3\u30C9\u30DD\u30A4\u30F3\u30C8\
        \u306E\u30EC\u30B9\u30DD\u30F3\u30B9"
      properties:
        area:
          $ref: '#/components/schemas/APIArea'
        cell:
          $ref: '#/components/schemas/APICell'
      required:
      - area
      - cell
      title: CurrentResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    PostsResponse:
      description: "\u6295\u7A3F\u4E00\u89A7\u30A8\u30F3\u30C9\u30DD\u30A4\u30F3\u30C8\
        \u306E\u30EC\u30B9\u30DD\u30F3\u30B9"
      properties:
        posts:
          items:
            $ref: '#/components/schemas/APIPost-Output'
          title: Posts
          type: array
      required:
      - posts
      title: PostsResponse
      type: object
    SignupResponse:
      description: "\u30B5\u30A4\u30F3\u30A2\u30C3\u30D7\u30A8\u30F3\u30C9\u30DD\u30A4\
        \u30F3\u30C8\u306E\u30EC\u30B9\u30DD\u30F3\u30B9"
      properties:
        access_token:
          title: Access Token
          type: string
        refresh_token:
          title: Refresh Token
          type: string
        user_id:
          title: User Id
          type: string
      required:
      - access_token
      - refresh_token
      - user_id
      title: SignupResponse
      type: object
    UpdatePromptResponse:
      description: "\u30D7\u30ED\u30F3\u30D7\u30C8\u66F4\u65B0\u30A8\u30F3\u30C9\u30DD\
        \u30A4\u30F3\u30C8\u306E\u30EC\u30B9\u30DD\u30F3\u30B9"
      properties:
        success:
          title: Success
          type: boolean
      required:
      - success
      title: UpdatePromptResponse
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  title: FastAPI
  version: 0.1.0
openapi: 3.1.0
paths:
  /:
    get:
      description: "\u30D8\u30EB\u30B9\u30C1\u30A7\u30C3\u30AF"
      operationId: health__get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
      tags:
      - health
  /areas:
    get:
      description: "\u5168\u30A8\u30EA\u30A2\u306E\u4E00\u89A7\u3092\u53D6\u5F97"
      operationId: get_areas_areas_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/APIArea'
                title: Response Get Areas Areas Get
                type: array
          description: Successful Response
      summary: Get Areas
      tags:
      - areas
  /batch/prompts/update:
    post:
      description: "\u5168\u30A8\u30EA\u30A2\u306E\u30D7\u30ED\u30F3\u30D7\u30C8\u3092\
        \u30D0\u30C3\u30C1\u66F4\u65B0"
      operationId: update_prompt_batch_prompts_update_post
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePromptResponse'
          description: Successful Response
      summary: Update Prompt
      tags:
      - batch
  /current:
    get:
      description: "\u73FE\u5728\u4F4D\u7F6E\u306E\u30A8\u30EA\u30A2\u3068\u30BB\u30EB\
        \u60C5\u5831\u3092\u53D6\u5F97"
      operationId: get_current_current_get
      parameters:
      - in: query
        name: lat
        required: true
        schema:
          title: Lat
          type: number
      - in: query
        name: lon
        required: true
        schema:
          title: Lon
          type: number
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Current
      tags:
      - current
  /posts:
    get:
      description: "\u73FE\u5728\u4F4D\u7F6E\u306E\u6295\u7A3F\u4E00\u89A7\u3092\u53D6\
        \u5F97"
      operationId: get_posts_posts_get
      parameters:
      - in: query
        name: lat
        required: true
        schema:
          title: Lat
          type: number
      - in: query
        name: lon
        required: true
        schema:
          title: Lon
          type: number
      - in: header
        name: authorization
        required: true
        schema:
          title: Authorization
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Posts
      tags:
      - posts
    post:
      description: "\u65B0\u3057\u3044\u6295\u7A3F\u3092\u4F5C\u6210"
      operationId: create_post_posts_post
      parameters:
      - in: header
        name: authorization
        required: true
        schema:
          title: Authorization
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePostResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Post
      tags:
      - posts
  /posts/me:
    get:
      description: "\u81EA\u5206\u306E\u6295\u7A3F\u4E00\u89A7\u3092\u53D6\u5F97"
      operationId: get_my_posts_posts_me_get
      parameters:
      - in: header
        name: authorization
        required: true
        schema:
          title: Authorization
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get My Posts
      tags:
      - posts
  /signup:
    post:
      description: "\u533F\u540D\u30E6\u30FC\u30B6\u30FC\u3068\u3057\u3066\u30B5\u30A4\
        \u30F3\u30A2\u30C3\u30D7"
      operationId: signup_signup_post
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
          description: Successful Response
      summary: Signup
      tags:
      - auth

